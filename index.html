<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>あぽろん レッスン日程</title>
<meta name="description" content="あぽろんミュージックスクール レッスン日程確認アプリ。教室・曜日・先生を選ぶとレッスン日がわかります。" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#e8556f" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="あぽろん日程" />
<link rel="stylesheet" href="styles.css?v=20260822q" />
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>あぽろん レッスン日程</h1>
    <p class="hero-sub">教室・曜日・先生を選ぶと、レッスンの日がすぐわかるよ&#9834;</p>
    <div class="hero-notes" aria-hidden="true">&#9834; &#9835; &#9836;</div>
  </header>

  <main>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="result" id="result" hidden></section>

    <section class="step" id="step-store">
      <h2><span class="step-num">1</span>教室を選ぶ</h2>
      <div class="chip-grid" id="store-list"></div>
    </section>

    <section class="step" id="step-weekday" hidden>
      <h2><span class="step-num">2</span>曜日を選ぶ</h2>
      <div class="chip-row" id="weekday-list"></div>
    </section>

    <section class="step" id="step-teacher" hidden>
      <h2><span class="step-num">3</span>先生を選ぶ</h2>
      <div class="chip-grid" id="teacher-list"></div>
    </section>
  </main>

  <footer>
    <button class="refresh-btn" id="refresh-btn" type="button">最新の情報に更新</button>
    <p class="updated" id="updated-info"></p>
    <p class="sheet-link" id="sheet-link"></p>
    <p class="bookmark-tip">&#127925; 「ホーム画面に追加」しておくと、次からアプリみたいに1タップで開けるよ<br />(iPhone: 共有ボタン → ホーム画面に追加 / Android: メニュー → ホーム画面に追加)</p>
    <p class="app-version">v20260822q</p>
  </footer>
</div>

<script src="src/constants.js?v=20260822q"></script>
<script src="src/csv.js?v=20260822q"></script>
<script src="src/schedule.js?v=20260822q"></script>
<script src="src/instruments.js?v=20260822q"></script>
<script src="src/storage.js?v=20260822q"></script>
<script src="src/app.js?v=20260822q"></script>
</body>
</html>
