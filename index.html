<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>あぽろん レッスン日程</title>
<meta name="description" content="あぽろんミュージックスクール レッスン日程確認アプリ。教室・曜日・先生を選ぶとレッスン日がわかります。" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#e8556f" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="あぽろん日程" />
<link rel="stylesheet" href="styles.css?v=3-c736839" />
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>あぽろん レッスン日程</h1>
    <p class="hero-sub">教室・曜日・先生を選ぶと、レッスンの日がすぐわかるよ&#9834;</p>
    <div class="hero-notes" aria-hidden="true">&#9834; &#9835; &#9836;</div>
  </header>

  <main>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="retry-btn" id="retry-btn" type="button" hidden>もう一度試す</button>

    <section class="result" id="result" hidden></section>

    <section class="step" id="step-store">
      <h2><span class="step-num">1</span>教室を選ぶ</h2>
      <div class="chip-grid" id="store-list"></div>
    </section>

    <section class="step" id="step-weekday" hidden>
      <h2><span class="step-num">2</span>曜日を選ぶ</h2>
      <div class="chip-row" id="weekday-list"></div>
    </section>

    <section class="step" id="step-teacher" hidden>
      <h2><span class="step-num">3</span>先生を選ぶ</h2>
      <div class="chip-grid" id="teacher-list"></div>
    </section>
  </main>

  <footer>
    <div class="footer-actions">
      <button class="qr-btn" id="qr-btn" type="button">
        <svg class="qr-btn-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
          <rect x="14" y="3" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
          <rect x="3" y="14" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
          <rect x="14" y="14" width="3" height="3" fill="currentColor" />
          <rect x="19" y="14" width="2" height="2" fill="currentColor" />
          <rect x="14" y="19" width="2" height="2" fill="currentColor" />
          <rect x="17" y="17" width="2" height="2" fill="currentColor" />
          <rect x="19" y="19" width="2" height="2" fill="currentColor" />
        </svg>
        アプリ紹介QR
      </button>
      <button class="theme-toggle-btn" id="theme-toggle-btn" type="button">🌙 ダーク表示</button>
    </div>
    <p class="updated" id="updated-info"></p>
    <p class="sheet-link" id="sheet-link"></p>
    <p class="bookmark-tip">&#127925; 「ホーム画面に追加」しておくと、<br />次からアプリみたいに1タップで開けるよ<br />iPhone &gt; 共有ボタン → ホーム画面に追加<br />Android &gt; メニュー → ホーム画面に追加</p>
    <p class="unofficial-note">非公式のお手伝いアプリです。<br />正式な情報は公式サイトをご確認ください。</p>
    <a class="official-site-card" href="https://apollonmusic.com/" target="_blank" rel="noopener">
      <span class="official-site-card-label">あぽろん (楽器販売・通販・音楽教室)</span>
      <span class="official-site-card-cta">公式サイト &#8250;</span>
    </a>
    <p class="app-version">v3-c736839</p>
  </footer>
</div>

<div class="qr-modal" id="qr-modal" hidden>
  <div class="qr-modal-card">
    <button class="qr-modal-close" id="qr-modal-close" type="button" aria-label="閉じる">&times;</button>
    <p class="qr-modal-title">このアプリを友だちにも&#9834;</p>
    <img class="qr-modal-img" src="icons/qr-share.png" alt="このアプリを開くQRコード" width="240" height="240" />
    <p class="qr-modal-tip">スマホのカメラで読み取ってね</p>
  </div>
</div>

<script src="src/constants.js?v=3-c736839"></script>
<script src="src/csv.js?v=3-c736839"></script>
<script src="src/schedule.js?v=3-c736839"></script>
<script src="src/instruments.js?v=3-c736839"></script>
<script src="src/storage.js?v=3-c736839"></script>
<script src="src/app.js?v=3-c736839"></script>
</body>
</html>
